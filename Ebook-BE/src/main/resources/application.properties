spring.application.name=Ebook-BE
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ebook}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Config ORM properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Config file upload properties
project.image=src/main/resources/static/images/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Config Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

server.fileUrl=http://localhost:8080/api/books/download/

# Config PayOS

payos.baseReturnUrl=${PAYOS_RETURN_URL:/order/success}
payos.baseCancelUrl=${PAYOS_CANCEL_URL:/order/cancel}
payos.clientId=${PAYOS_CLIENT_ID:...}
payos.apiKey=${PAYOS_API_KEY:...}
payos.checksumKey=${PAYOS_CHECKSUM_KEY:...}

# Config Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=adslagame136@gmail.com
spring.mail.password=..
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
nameEmail=EStore